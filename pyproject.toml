[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "obmlx"
version = "0.1.0"
description = "Experimental Oriented Basis Transform implementation and synthetic-signal experiments using MLX"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "mlx==0.32.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx[cuda12]==0.32.4; sys_platform == 'linux'",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
    "jupyter==1.1.1",
    "nbformat==5.11.1",
    "nbconvert==7.17.2",
    "nbclient==0.11.0",
    "psutil==7.2.2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["obf"]
py-modules = ["ob"]

[tool.setuptools.package-data]
obf = ["matrices/*.safetensors"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
]
